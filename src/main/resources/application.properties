# =====================================================================
# AgroRetorno - configuración principal
# Todos los valores sensibles pueden sobrescribirse con variables de entorno.
# =====================================================================
spring.application.name=AgroRetorno
# PORT lo asignan plataformas en la nube (Railway, Render); SERVER_PORT tiene prioridad
server.port=${SERVER_PORT:${PORT:8080}}
# Detrás del proxy HTTPS de la plataforma: respeta X-Forwarded-Proto para redirecciones correctas
server.forward-headers-strategy=framework

# ---------- PostgreSQL (base de datos operativa) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:agroretorno}
spring.datasource.username=${DB_USER:agroretorno}
spring.datasource.password=${DB_PASSWORD:agroretorno}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000

# ---------- JPA / Hibernate ----------
# El esquema lo crea Flyway; Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.show-sql=false

# ---------- Flyway (migraciones versionadas) ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=true

# ---------- Sesión web ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Lima

# ---------- Actuator (monitoreo de CPU/memoria para G08) ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ---------- Reglas de negocio configurables (G02) ----------
agroretorno.zona-horaria=America/Lima
# Plazo permitido entre hoy y la fecha prevista de devolución (en días)
agroretorno.reglas.plazo-minimo-dias=1
agroretorno.reglas.plazo-maximo-dias=90
# Longitud mínima del motivo de la solicitud y del rechazo
agroretorno.reglas.longitud-minima-motivo=5
# Carga de datos de demostración al iniciar (solo si la base está vacía)
agroretorno.datos-demo.habilitado=${DEMO_DATA:true}

# ---------- Logs ----------
logging.level.root=INFO
logging.level.pe.edu.agroretorno=INFO
