<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Materiales')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 titulo-pagina mb-0">Materiales reutilizables</h1>
        <a th:href="@{/encargado/materiales/nuevo}" class="btn btn-primary" data-testid="btn-nuevo-material">
            <i class="bi bi-plus-circle"></i> Registrar material</a>
    </div>
    <form th:action="@{/encargado/materiales}" method="get" class="card card-body mb-3">
        <div class="row g-2">
            <div class="col-md-6"><input type="search" name="q" class="form-control" th:value="${q}" maxlength="100"
                                         placeholder="Buscar por nombre o código" data-testid="buscar-texto"></div>
            <div class="col-md-4">
                <select name="categoria" class="form-select">
                    <option value="">Todas las categorías</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c.etiqueta}" th:selected="${c == categoriaSeleccionada}">c</option>
                </select>
            </div>
            <div class="col-md-2 d-grid"><button class="btn btn-outline-primary" type="submit">Buscar</button></div>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-agro table-hover mb-0" data-testid="tabla-materiales">
                <thead><tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Unidad</th><th class="text-end">Total</th>
                    <th class="text-end">Disponible</th><th>Estado</th><th></th></tr></thead>
                <tbody>
                <tr th:each="m : ${materiales}" data-testid="fila-material" th:attr="data-codigo=${m.codigo()}">
                    <td class="fw-semibold" th:text="${m.codigo()}">COD</td>
                    <td th:text="${m.nombre()}">Nombre</td>
                    <td th:text="${m.categoriaEtiqueta()}">Cat</td>
                    <td th:text="${m.unidad()}">u</td>
                    <td class="text-end" th:text="${m.cantidadTotal()}">0</td>
                    <td class="text-end" th:text="${m.cantidadDisponible()}">0</td>
                    <td><span class="badge" th:classappend="${m.activo()} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${m.estado()}">ACTIVO</span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/encargado/materiales/{id}/editar(id=${m.id()})}"
                           th:attr="data-testid='editar-' + ${m.codigo()}"><i class="bi bi-pencil"></i> Editar</a>
                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/encargado/existencias/{id}(id=${m.id()})}">
                            <i class="bi bi-boxes"></i> Existencias</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(materiales)}"><td colspan="8" class="text-center text-muted py-4">Sin resultados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
