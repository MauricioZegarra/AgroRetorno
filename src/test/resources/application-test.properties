# Perfil "test": H2 en memoria SOLO para pruebas automatizadas aisladas.
# La base de datos operativa del producto es PostgreSQL (ver application.properties).
spring.datasource.url=jdbc:h2:mem:agroretorno_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# El esquema Flyway usa expresiones propias de PostgreSQL (operador ~); en H2 se genera desde las entidades.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
# Se cargan los mismos datos ficticios de demostración para tener cuentas conocidas
agroretorno.datos-demo.habilitado=true
logging.level.root=WARN
